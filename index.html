<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market Lens — Stock Analysis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
  // Set this to your deployed backend URL before pushing to GitHub Pages, e.g.
  // window.MARKET_LENS_API = 'https://your-app.onrender.com';
  window.MARKET_LENS_API = 'https://market-lens-pgac.onrender.com';
</script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #050505;
  --surface: #0d0d0d;
  --surface2: #151515;
  --border: rgba(255,255,255,0.08);
  --border-strong: rgba(255,255,255,0.16);
  --text: #f3f4f6;
  --text-2: #9ca3af;
  --text-3: #6b7280;
  --accent: #d4af37;
  --accent-dim: rgba(212,175,55,0.15);
  --green: #10b981;
  --green-dim: rgba(16,185,129,0.12);
  --red: #ef4444;
  --red-dim: rgba(239,68,68,0.12);
  --amber: #f59e0b;
  --radius: 10px;
  --radius-lg: 16px;
}

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.5;
}

/* ── Layout ── */
.app { display: flex; flex-direction: column; min-height: 100vh; }

.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 28px; height: 60px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 100;
}
.logo { font-size: 16px; font-weight: 600; letter-spacing: -0.3px; color: var(--text); display: flex; align-items: center; gap: 8px; }
.logo-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: inline-block; }

.main { display: grid; grid-template-columns: 280px 1fr; flex: 1; }

.sidebar {
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 20px 0;
  overflow-y: auto;
}

.content { padding: 24px; overflow-x: hidden; }

/* ── Search ── */
.search-wrap { padding: 0 16px 16px; }
.search-box {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg); border: 1px solid var(--border-strong);
  border-radius: var(--radius); padding: 9px 12px; cursor: text;
}
.search-box input {
  background: none; border: none; outline: none; color: var(--text);
  font-family: inherit; font-size: 13px; width: 100%;
}
.search-box input::placeholder { color: var(--text-3); }
.search-icon { color: var(--text-3); font-size: 15px; flex-shrink: 0; }

/* ── Company list ── */
.section-label {
  font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
  color: var(--text-3); padding: 8px 16px 6px;
}

.company-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px; cursor: pointer; border-radius: 0;
  transition: background 0.12s; gap: 10px;
  border-left: 2px solid transparent;
}
.company-item:hover { background: var(--surface2); }
.company-item.active { background: var(--accent-dim); border-left-color: var(--accent); }

.co-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
.ticker-badge {
  font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500;
  background: var(--surface2); color: var(--text-2);
  border: 1px solid var(--border-strong);
  border-radius: 5px; padding: 2px 6px; flex-shrink: 0;
  min-width: 42px; text-align: center;
}
.company-item.active .ticker-badge { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }
.co-name { font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.co-price { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text); flex-shrink: 0; }

/* ── Timeframe ── */
.timeframe-strip {
  display: flex; align-items: center; gap: 4px;
  padding: 16px;
  border-top: 1px solid var(--border);
  margin-top: 8px;
}
.tf-btn {
  font-size: 11px; font-weight: 500; padding: 5px 9px; border-radius: 6px;
  border: 1px solid transparent; background: none; color: var(--text-3);
  cursor: pointer; transition: all 0.12s; font-family: inherit;
}
.tf-btn:hover { background: var(--surface2); color: var(--text-2); }
.tf-btn.active { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }

/* ── Compare toggle ── */
.compare-wrap { padding: 0 16px 12px; }
.compare-toggle {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; color: var(--text-2); cursor: pointer; user-select: none;
}
.toggle-track {
  width: 32px; height: 18px; border-radius: 9px; background: var(--border-strong);
  position: relative; transition: background 0.2s; flex-shrink: 0;
}
.toggle-track.on { background: var(--accent); }
.toggle-thumb {
  position: absolute; top: 2px; left: 2px;
  width: 14px; height: 14px; border-radius: 50%;
  background: white; transition: left 0.2s;
}
.toggle-track.on .toggle-thumb { left: 16px; }

/* ── Compare list ── */
.compare-list { padding: 0 16px; display: none; }
.compare-list.show { display: block; }
.compare-check {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 0; font-size: 12px; color: var(--text-2);
  cursor: pointer;
}
.compare-check input[type=checkbox] { accent-color: var(--accent); width: 13px; height: 13px; cursor: pointer; }

/* ── Content header ── */
.content-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 24px; gap: 16px; flex-wrap: wrap; }
.co-headline h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.5px; }
.co-headline .tagline { font-size: 13px; color: var(--text-2); margin-top: 2px; }

.price-block { text-align: right; }
.price-big { font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 500; line-height: 1; }
.price-delta {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 13px; font-weight: 500; margin-top: 4px;
  padding: 3px 8px; border-radius: 5px;
}
.price-delta.up { background: var(--green-dim); color: var(--green); }
.price-delta.dn { background: var(--red-dim); color: var(--red); }

/* ── Stat row ── */
.stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
.stat-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 16px;
}
.stat-label { font-size: 11px; color: var(--text-3); margin-bottom: 4px; letter-spacing: 0.3px; }
.stat-val { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 500; color: var(--text); }
.stat-sub { font-size: 11px; color: var(--text-2); margin-top: 2px; }

/* ── Chart area ── */
.chart-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 20px;
}
.chart-toolbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px 12px; border-bottom: 1px solid var(--border);
}
.chart-title { font-size: 14px; font-weight: 500; color: var(--text); }
.chart-meta { font-size: 12px; color: var(--text-3); }
.chart-legend { display: flex; gap: 16px; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-2); }
.legend-dot { width: 10px; height: 3px; border-radius: 2px; }

.chart-body { padding: 16px 20px 20px; }
.chart-wrap { position: relative; width: 100%; }

/* ── MA toggles ── */
.ma-controls { display: flex; gap: 8px; padding: 0 20px 16px; }
.ma-btn {
  font-size: 11px; padding: 4px 10px; border-radius: 5px;
  border: 1px solid var(--border-strong); background: none;
  color: var(--text-3); cursor: pointer; font-family: inherit;
  transition: all 0.12s;
}
.ma-btn.on { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }
.ma-btn[data-ma="20"].on { background: rgba(16,185,129,0.12); color: var(--green); border-color: var(--green); }

/* ── Volume chart ── */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }

/* ── Loading ── */
.loading-state {
  display: flex; align-items: center; justify-content: center;
  height: 200px; color: var(--text-3); gap: 8px; flex-direction: column;
}
.spinner {
  width: 20px; height: 20px; border-radius: 50%;
  border: 2px solid var(--border-strong); border-top-color: var(--accent);
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Info strip ── */
.info-strip {
  display: flex; gap: 24px; flex-wrap: wrap;
  padding: 14px 20px; background: var(--bg); border-top: 1px solid var(--border);
  font-size: 12px;
}
.info-item { display: flex; gap: 6px; }
.info-key { color: var(--text-3); }
.info-val { color: var(--text-2); font-family: 'JetBrains Mono', monospace; }

/* ── No results ── */
.no-results { padding: 16px; font-size: 12px; color: var(--text-3); text-align: center; }

/* ── Tooltip ── */
.info-ic {
  display:inline-flex; align-items:center; justify-content:center;
  width:13px; height:13px; border-radius:50%; border:1px solid var(--text-3);
  color:var(--text-3); font-size:9px; cursor:help; position:relative; margin-left:4px;
}
/* Tooltip is a single shared element appended to <body> and positioned with
   JS on hover/focus, so it can never be clipped by a chart-card's
   overflow:hidden (needed elsewhere for rounded chart corners). */
#globalTip {
  display:none; position:fixed; background:#151515; color:var(--text);
  font-size:11px; font-weight:400; padding:8px 10px; border-radius:7px;
  border:1px solid var(--border-strong); width:190px; line-height:1.4;
  z-index:9999; box-shadow:0 6px 20px rgba(0,0,0,0.45); pointer-events:none;
}

/* ── Tabs ── */
.view-tabs { display:flex; gap:4px; margin-bottom:20px; border-bottom:1px solid var(--border); }
.view-tab {
  font-size:13px; font-weight:500; padding:9px 4px; margin-right:16px;
  background:none; border:none; color:var(--text-3); cursor:pointer;
  border-bottom:2px solid transparent; font-family:inherit;
}
.view-tab.active { color:var(--text); border-bottom-color:var(--accent); }

/* ── Cross badge ── */
.cross-badge {
  display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:500;
  padding:3px 9px; border-radius:6px; margin-left:8px;
}
.cross-badge.golden { background:rgba(245,158,11,0.14); color:var(--amber); }
.cross-badge.death  { background:var(--red-dim); color:var(--red); }

/* ── Screener table ── */
.screener-table { width:100%; border-collapse:collapse; font-size:13px; }
.screener-table th {
  text-align:left; font-size:11px; color:var(--text-3); font-weight:500;
  padding:10px 12px; border-bottom:1px solid var(--border); white-space:nowrap;
}
.screener-table td { padding:11px 12px; border-bottom:1px solid var(--border); }
.screener-table tr:hover td { background:var(--surface2); cursor:pointer; }
.score-pill {
  display:inline-block; padding:2px 9px; border-radius:6px; font-size:11px; font-weight:500;
}
.score-pill.strong { background:var(--green-dim); color:var(--green); }
.score-pill.watch { background:rgba(245,158,11,0.14); color:var(--amber); }
.score-pill.weak { background:var(--red-dim); color:var(--red); }
.data-src {
  font-size:11px; color:var(--text-3); display:flex; align-items:center; gap:6px;
  padding:6px 16px 14px;
}
.data-src .dot { width:6px; height:6px; border-radius:50%; }
.data-src .dot.live { background:var(--green); }
.data-src .dot.sim { background:var(--amber); }
.search-results { padding:4px 0; border-bottom:1px solid var(--border); margin-bottom:4px; }
.search-results .company-item { opacity:0.95; }
.search-loading { padding:8px 16px; font-size:11px; color:var(--text-3); }
.remove-x {
  opacity:0; width:16px; height:16px; display:flex; align-items:center; justify-content:center;
  color:var(--text-3); border-radius:4px; flex-shrink:0;
}
.company-item:hover .remove-x { opacity:1; }
.remove-x:hover { background:var(--red-dim); color:var(--red); }

/* ── Indicator dropdown ── */
body { background: var(--bg); }
.ind-bar { display:flex; align-items:center; gap:14px; margin:0 0 16px; flex-wrap:wrap; }
.ind-hint { font-size:11px; color:var(--text-3); }
.ind-menu { position:relative; }
.ind-trigger { font-family:inherit; font-size:12px; font-weight:500; color:var(--accent); background:var(--accent-dim); border:1px solid var(--accent); border-radius:8px; padding:7px 12px; cursor:pointer; display:flex; align-items:center; gap:8px; }
.ind-count { background:var(--accent); color:#0a0a0a; border-radius:9px; padding:0 7px; font-size:11px; font-weight:600; }
.ind-panel { display:none; position:absolute; left:0; top:calc(100% + 6px); z-index:60; width:270px; max-height:440px; overflow-y:auto; background:var(--surface2); border:1px solid var(--border-strong); border-radius:12px; padding:4px 14px 14px; box-shadow:0 14px 40px rgba(0,0,0,0.6); }
.ind-menu.open .ind-panel { display:block; }
.ind-group { font-size:10px; font-weight:600; letter-spacing:1px; text-transform:uppercase; color:var(--text-3); margin:14px 0 2px; }
.ind-opt { position:relative; display:flex; align-items:center; gap:10px; margin-top:10px; padding:8px 10px; border:1px solid var(--border); border-radius:8px; font-size:12px; color:var(--text-2); cursor:pointer; user-select:none; }
.ind-opt:hover { border-color:var(--border-strong); color:var(--text); }
.ind-opt.on { color:var(--text); border-color:var(--accent); background:var(--accent-dim); }
.ind-box { width:12px; height:12px; border:1px solid var(--text-3); border-radius:3px; flex-shrink:0; }
.ind-opt.on .ind-box { background:var(--accent); border-color:var(--accent); }
.ind-opt .info-ic { margin-left:auto; flex-shrink:0; }
.ind-opt.disabled { opacity:0.38; cursor:not-allowed; }
.ind-opt.disabled:hover { border-color:var(--border); color:var(--text-2); }
.ind-note { font-size:10px; color:var(--text-3); }

@media (max-width: 768px) {
  .main { grid-template-columns: 1fr; }
  .sidebar { border-right: none; border-bottom: 1px solid var(--border); max-height: 260px; }
  .stat-row { grid-template-columns: repeat(2, 1fr); }
  .two-col { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="app">

<!-- Topbar -->
<header class="topbar">
  <div class="logo"><span class="logo-dot"></span> Market Lens</div>
  <div style="font-size:12px;color:var(--text-3);">Educational use</div>
</header>

<div class="main">

<!-- Sidebar -->
<aside class="sidebar">
  <div class="search-wrap">
    <div class="search-box">
      <svg class="search-icon" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="searchInput" placeholder="Search companies…" autocomplete="off" aria-label="Search companies">
    </div>
  </div>

  <div class="section-label">Companies</div>
  <div id="companyList"></div>

  <div style="border-top:1px solid var(--border);margin-top:16px;padding-top:4px;">
    <div class="section-label">Timeframe</div>
    <div class="timeframe-strip" id="tfStrip">
      <button class="tf-btn" data-tf="1D">1D</button>
      <button class="tf-btn" data-tf="3D">3D</button>
      <button class="tf-btn" data-tf="1W">1W</button>
      <button class="tf-btn active" data-tf="1M">1M</button>
      <button class="tf-btn" data-tf="1Y">1Y</button>
      <button class="tf-btn" data-tf="3Y">3Y</button>
    </div>
  </div>

  <div class="data-src" id="dataSrc"><span class="dot sim"></span>Connecting… free servers can take up to a minute to wake</div>

  <div style="border-top:1px solid var(--border);padding-top:12px;">
    <div class="section-label">Compare</div>
    <div class="compare-wrap">
      <label class="compare-toggle" id="compareToggle">
        <div class="toggle-track" id="toggleTrack"><div class="toggle-thumb"></div></div>
        Overlay comparison
      </label>
    </div>
    <div class="compare-list" id="compareList"></div>
  </div>
</aside>

<!-- Main content -->
<div id="globalTip" role="tooltip"></div>

<main class="content" aria-live="polite">
  <div class="view-tabs">
    <button class="view-tab active" data-view="analysis">Analysis</button>
    <button class="view-tab" data-view="screener">Screener</button>
  </div>
  <div id="appContent">
    <div class="loading-state"><div class="spinner"></div><span>Select a company</span></div>
  </div>
</main>

</div>
</div>

<script>
'use strict';

/* ── API config ── */
// Point this at your deployed backend (see backend/app.py). Falls back to
// simulated data automatically if unreachable, so the dashboard still works
// standalone for a quick preview.
// Trailing slash is stripped automatically so a URL like
// 'https://your-app.onrender.com/' doesn't produce double-slash 404s
// (e.g. '//api/health') when endpoints are appended.
const API_BASE = (window.MARKET_LENS_API || 'http://localhost:5000').replace(/\/+$/, '');

/* ── Starter watchlist (editable — search adds any ticker, the X removes it) ── */
let COMPANIES = [
  { ticker:'AAPL', name:'Apple', sector:'Technology' },
  { ticker:'MSFT', name:'Microsoft', sector:'Technology' },
  { ticker:'GOOGL',name:'Alphabet', sector:'Technology' },
  { ticker:'AMZN', name:'Amazon', sector:'Consumer' },
  { ticker:'NVDA', name:'NVIDIA', sector:'Semiconductors' },
  { ticker:'META', name:'Meta', sector:'Technology' },
  { ticker:'TSLA', name:'Tesla', sector:'Automotive' },
];
// Simulation fallback params only — used when the API is unreachable
const SIM_PARAMS = {
  AAPL:{S0:250,mu:0.22,sigma:0.26,vol:75e6}, MSFT:{S0:450,mu:0.20,sigma:0.22,vol:22e6},
  GOOGL:{S0:250,mu:0.18,sigma:0.25,vol:20e6}, AMZN:{S0:220,mu:0.25,sigma:0.30,vol:40e6},
  NVDA:{S0:160,mu:0.60,sigma:0.50,vol:35e6}, META:{S0:520,mu:0.35,sigma:0.40,vol:18e6},
  TSLA:{S0:320,mu:0.15,sigma:0.55,vol:85e6}, DEFAULT:{S0:150,mu:0.15,sigma:0.25,vol:10e6}
};

const TF_DAYS = { '1D':1, '3D':3, '1W':5, '1M':21, '1Y':252, '3Y':756 };
const SERIES_COLORS = ['#38bdf8','#34d399','#c084fc','#f472b6','#fb923c'];

/* ── GBM simulation (fallback only, when API is unreachable) ── */
function genPrices(co, nDays) {
  const p = SIM_PARAMS[co.ticker] || SIM_PARAMS.DEFAULT;
  const seed = co.ticker.split('').reduce((a,c)=>a+c.charCodeAt(0),0);
  let s = seed;
  const rng = () => { s = (s * 1664525 + 1013904223) & 0xffffffff; return (s >>> 0) / 0xffffffff; };
  const boxMuller = () => Math.sqrt(-2*Math.log(rng()+1e-9))*Math.cos(2*Math.PI*rng());
  const dt = 1/252;
  const prices = [p.S0]; const vols = [];
  for (let i=1; i<nDays; i++) {
    const r = (p.mu - 0.5*p.sigma*p.sigma)*dt + p.sigma*Math.sqrt(dt)*boxMuller();
    prices.push(prices[i-1]*Math.exp(r));
    vols.push(Math.max(p.vol*0.3, p.vol*(0.7+0.6*rng())));
  }
  vols.push(vols[vols.length-1]||p.vol);
  return { prices, vols };
}

function genDates(nDays) {
  const end = new Date(); const dates = [];
  let d = new Date(end); d.setDate(d.getDate()-nDays);
  while (d <= end) {
    const day = d.getDay();
    if (day!==0&&day!==6) dates.push(new Date(d));
    d.setDate(d.getDate()+1);
  }
  return dates.slice(0, nDays);
}

function rollingMean(arr, w) {
  return arr.map((_, i) => {
    if (i < w-1) return null;
    const s = arr.slice(i-w+1,i+1).reduce((a,b)=>a+b,0);
    return s/w;
  });
}
function rsi(closes, w=14) {
  const out = new Array(closes.length).fill(50);
  let gain=0, loss=0;
  for (let i=1;i<closes.length;i++){
    const d = closes[i]-closes[i-1];
    gain = (gain*(w-1) + Math.max(d,0))/w;
    loss = (loss*(w-1) + Math.max(-d,0))/w;
    out[i] = loss===0 ? 100 : 100 - 100/(1+gain/loss);
  }
  return out;
}
function macdCalc(closes) {
  const ema = (arr,span) => { const k=2/(span+1); let prev=arr[0]; return arr.map((v,i)=>i===0?v:(prev=v*k+prev*(1-k))); };
  const f = ema(closes,12), s = ema(closes,26);
  const line = f.map((v,i)=>v-s[i]);
  const sig = ema(line,9);
  return { line, sig, hist: line.map((v,i)=>v-sig[i]) };
}
function findCrosses(ma20, ma200) {
  const golden=[], death=[];
  for (let i=1;i<ma20.length;i++){
    if(ma20[i]==null||ma200[i]==null||ma20[i-1]==null||ma200[i-1]==null) continue;
    const prevDiff = ma20[i-1]-ma200[i-1], curDiff = ma20[i]-ma200[i];
    if (prevDiff<=0 && curDiff>0) golden.push(i);
    if (prevDiff>=0 && curDiff<0) death.push(i);
  }
  return { golden, death };
}

/* Fetch one ticker's data from the backend, with a short client cache */
async function fetchLive(ticker) {
  const hit = liveCache[ticker];
  if (hit && Date.now()-hit.ts < LIVE_TTL) return hit.data;
  const res = await fetch(`${API_BASE}/api/stock/${ticker}`, { signal: AbortSignal.timeout(60000) });
  if (!res.ok) throw new Error('bad response');
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  liveCache[ticker] = { ts: Date.now(), data };
  return data;
}

/* Unified data getter: tries live API, falls back to simulated. Always async.
   Retries the API every RETRY_COOLDOWN ms instead of giving up permanently,
   so if you fix/restart the backend mid-session it recovers without a reload. */
const intraCache = {};
async function getSeriesIntraday(ticker) {
  const co = COMPANIES.find(c=>c.ticker===ticker) || { ticker, name:ticker, sector:'N/A' };
  try {
    let hit = intraCache[ticker];
    if (!hit || Date.now()-hit.ts > 55000) {
      const res = await fetch(`${API_BASE}/api/intraday/${ticker}`, { signal: AbortSignal.timeout(60000) });
      const d = await res.json();
      if (!res.ok || d.error) throw new Error(d.error || 'bad response');
      hit = intraCache[ticker] = { ts: Date.now(), d };
    }
    const d = hit.d, n = d.sessionBars, last = a => a.slice(a.length - n);
    apiReachable = true; updateDataSrcLabel();
    return { live:true, intraday:true, dates:last(d.ts).map(t=>new Date(t)), labels:last(d.labels),
      prices:last(d.close), vols:last(d.volume), ma20given:null, ma200given:null, bbU:null, bbL:null,
      rsiGiven:last(d.rsi14), full:{ c:d.close, h:d.high, l:d.low } };
  } catch (e) {
    apiReachable = false; lastApiFailAt = Date.now(); updateDataSrcLabel();
    const { prices, vols } = genPrices(co, 78);
    const t0 = new Date(); t0.setHours(9,30,0,0);
    const dates = prices.map((_,i) => new Date(t0.getTime()+i*300000));
    return { live:false, intraday:true, dates, labels:dates.map(d=>d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false})),
      prices, vols, ma20given:null, ma200given:null, bbU:null, bbL:null, rsiGiven:null };
  }
}
const RETRY_COOLDOWN = 15000;
let lastApiFailAt = 0;
async function getSeries(ticker, nDays) {
  if (nDays === 1) return getSeriesIntraday(ticker);
  const co = COMPANIES.find(c=>c.ticker===ticker) || { ticker, name:ticker, sector:'N/A' };
  const shouldTry = apiReachable !== false || (Date.now() - lastApiFailAt > RETRY_COOLDOWN);
  if (shouldTry) {
    try {
      const d = await fetchLive(ticker);
      apiReachable = true; updateDataSrcLabel();
      const n = d.close.length;
      const start = Math.max(0, n-nDays);
      const slice = (arr) => arr.slice(start);
      return {
        live:true, dates: slice(d.dates).map(s=>new Date(s)),
        prices: slice(d.close), vols: slice(d.volume),
        ma20given: slice(d.ma20), ma200given: slice(d.ma200),
        bbU: slice(d.bbUpper), bbL: slice(d.bbLower), rsiGiven: slice(d.rsi14),
        full: { c:d.close, h:d.high||null, l:d.low||null },
      };
    } catch (e) {
      apiReachable = false; lastApiFailAt = Date.now(); updateDataSrcLabel();
    }
  }
  const { prices, vols } = genPrices(co, nDays);
  const dates = genDates(nDays);
  return { live:false, dates, prices, vols, ma20given:null, ma200given:null, bbU:null, bbL:null, rsiGiven:null };
}

/* ── Precompute latest prices (3Y) for sidebar + screener ── */
const latestPrices = {};
const screenerCache = {};
async function computeScreenerRow(co) {
  const s = await getSeries(co.ticker, 756);
  const closes = s.prices;
  const ma20 = s.ma20given || rollingMean(closes,20);
  const ma200 = s.ma200given || rollingMean(closes,200);
  const rsiArr = s.rsiGiven || rsi(closes);
  const curRSI = rsiArr[rsiArr.length-1];
  const curPrice = closes[closes.length-1];
  const { golden, death } = findCrosses(ma20, ma200);
  const lastGoldenIdx = golden.length ? golden[golden.length-1] : -1;
  const lastDeathIdx = death.length ? death[death.length-1] : -1;
  const inGoldenState = lastGoldenIdx > lastDeathIdx;
  const mom = (closes[closes.length-1]-closes[Math.max(0,closes.length-21)])/closes[Math.max(0,closes.length-21)]*100;
  let score = 0;
  if (inGoldenState) score += 2;
  if (curRSI > 45 && curRSI < 70) score += 1;
  if (curRSI >= 70) score -= 1;
  if (mom > 0) score += 1;
  if (mom > 8) score += 1;
  const daysSinceCross = inGoldenState ? closes.length - lastGoldenIdx : null;
  if (daysSinceCross !== null && daysSinceCross < 15) score += 1;
  latestPrices[co.ticker] = curPrice;
  return { co, curPrice, curRSI, mom, inGoldenState, score, daysSinceCross };
}

/* ── Indicator math (computed in the browser so it also works on fallback data) ── */
function emaArr(a, n) {
  const k = 2/(n+1), out = new Array(a.length).fill(null); let prev = null;
  for (let i=0;i<a.length;i++) {
    if (i === n-1) { prev = a.slice(0,n).reduce((x,y)=>x+y,0)/n; out[i] = prev; }
    else if (i >= n) { prev = a[i]*k + prev*(1-k); out[i] = prev; }
  }
  return out;
}
function stochCalc(h, l, c, n=14) {
  const k = c.map((_,i) => { if (i<n-1) return null; let hi=-Infinity, lo=Infinity;
    for (let j=i-n+1;j<=i;j++) { if (h[j]>hi) hi=h[j]; if (l[j]<lo) lo=l[j]; }
    return hi===lo ? 50 : (c[i]-lo)/(hi-lo)*100; });
  const d = k.map((_,i) => i<n+1 ? null : (k[i]+k[i-1]+k[i-2])/3);
  return { k, d };
}
function adxCalc(h, l, c, n=14) {
  const len = c.length, pdi = new Array(len).fill(null), mdi = new Array(len).fill(null),
        adx = new Array(len).fill(null), dx = [];
  let trS=0, pS=0, mS=0;
  for (let i=1;i<len;i++) {
    const up = h[i]-h[i-1], dn = l[i-1]-l[i];
    const tr = Math.max(h[i]-l[i], Math.abs(h[i]-c[i-1]), Math.abs(l[i]-c[i-1]));
    const p = (up>dn && up>0) ? up : 0, m = (dn>up && dn>0) ? dn : 0;
    if (i<=n) { trS+=tr; pS+=p; mS+=m; } else { trS = trS-trS/n+tr; pS = pS-pS/n+p; mS = mS-mS/n+m; }
    if (i>=n) { const pd = 100*pS/trS, md = 100*mS/trS; pdi[i]=pd; mdi[i]=md; dx[i] = 100*Math.abs(pd-md)/((pd+md)||1); }
  }
  let a = null;
  for (let i=n;i<len;i++) {
    if (i === 2*n-1) { let t=0; for (let j=n;j<=i;j++) t+=dx[j]; a=t/n; adx[i]=a; }
    else if (i > 2*n-1) { a = (a*(n-1)+dx[i])/n; adx[i]=a; }
  }
  return { pdi, mdi, adx };
}
function ichiCalc(h, l) {
  const mid = (i,n) => { if (i<n-1) return null; let hi=-Infinity, lo=Infinity;
    for (let j=i-n+1;j<=i;j++) { if (h[j]>hi) hi=h[j]; if (l[j]<lo) lo=l[j]; } return (hi+lo)/2; };
  const t = h.map((_,i)=>mid(i,9)), k = h.map((_,i)=>mid(i,26)), b = h.map((_,i)=>mid(i,52));
  const sa = h.map((_,i)=> (i>=26 && t[i-26]!=null && k[i-26]!=null) ? (t[i-26]+k[i-26])/2 : null);
  const sb = h.map((_,i)=> i>=26 ? b[i-26] : null);
  return { tenkan:t, kijun:k, spanA:sa, spanB:sb };
}
function stdevArr(a, n=20) {
  return a.map((_,i) => { if (i<n-1) return null; const w = a.slice(i-n+1,i+1), m = w.reduce((x,y)=>x+y,0)/n;
    return Math.sqrt(w.reduce((x,y)=>x+(y-m)**2,0)/n); });
}

/* Global tooltip: positioned in viewport coordinates so it's never clipped
   by a chart-card's overflow:hidden. Delegated listener covers tooltips
   added later by re-renders. */
function initTooltips() {
  const tip = document.getElementById('globalTip');
  function show(el) {
    tip.textContent = el.dataset.tip;
    tip.style.display = 'block';
    const r = el.getBoundingClientRect();
    const tw = 190;
    let left = r.left + r.width/2 - tw/2;
    left = Math.max(8, Math.min(left, window.innerWidth - tw - 8));
    let top = r.top - tip.offsetHeight - 8;
    if (top < 4) top = r.bottom + 8; // flip below if no room above
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
  }
  function hide() { tip.style.display = 'none'; }
  document.addEventListener('mouseover', e => { const el = e.target.closest('[data-tip]'); if (el) show(el); });
  document.addEventListener('mouseout', e => { if (e.target.closest('[data-tip]')) hide(); });
  document.addEventListener('focusin', e => { const el = e.target.closest('[data-tip]'); if (el) show(el); });
  document.addEventListener('focusout', e => { if (e.target.closest('[data-tip]')) hide(); });
  window.addEventListener('scroll', hide, true);
}

  const el = document.getElementById('appContent');
  el.innerHTML = `
    <h2 class="sr-only" style="position:absolute;left:-9999px">Stock data for ${co.name} (${co.ticker}) over ${activeTF}</h2>
    <div class="content-header">
      <div class="co-headline">
        <h1>${co.name} <span style="color:var(--text-3);font-weight:400;font-size:16px">${co.ticker}</span></h1>
        <div class="tagline">${co.sector} · ${activeTF} view
        ${lastCrossType==='golden' ? `<span class="cross-badge golden">▲ Golden cross ${ic('golden')}</span>` : ''}
        ${lastCrossType==='death' ? `<span class="cross-badge death">▼ Death cross ${ic('death')}</span>` : ''}
        </div>
      </div>
      <div class="price-block">
        <div class="price-big">$${cur.toFixed(2)}</div>
        <div class="price-delta ${up?'up':'dn'}">
          <svg width="10" height="10" viewBox="0 0 10 10" fill="currentColor" aria-hidden="true">
            <path d="${up?'M5 1l4 8H1z':'M5 9L1 1h8z'}"/>
          </svg>
          ${up?'+':''}${delta.toFixed(2)} (${up?'+':''}${pct.toFixed(2)}%)
        </div>
      </div>
    </div>

    <div class="stat-row">
      <div class="stat-card">
        <div class="stat-label">Period high</div>
        <div class="stat-val">$${high.toFixed(2)}</div>
        <div class="stat-sub">${activeTF} range</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Period low</div>
        <div class="stat-val">$${low.toFixed(2)}</div>
        <div class="stat-sub">${activeTF} range</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total return${ic('totalReturn')}</div>
        <div class="stat-val" style="color:${totalReturn>=0?'var(--green)':'var(--red)'}">
          ${totalReturn>=0?'+':''}${totalReturn.toFixed(1)}%
        </div>
        <div class="stat-sub">Over ${activeTF}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">RSI (14)${ic('rsi')}</div>
        <div class="stat-val" style="color:${curRSI>=70?'var(--red)':curRSI<=30?'var(--green)':'var(--text)'}">${curRSI.toFixed(0)}</div>
        <div class="stat-sub">${curRSI>=70?'Overbought':curRSI<=30?'Oversold':'Neutral'}</div>
      </div>
    </div>

    <div class="ind-bar">${indMenuHTML()}<span class="ind-hint">Pick indicators to overlay or add as panels. Hover an option to see what it means.</span></div>

    <div class="chart-card">
      <div class="chart-toolbar">
        <div>
          <div class="chart-title">Price history</div>
          <div class="chart-meta">${dates[0].toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})} – ${dates[dates.length-1].toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</div>
        </div>
        <div class="chart-legend" id="priceLegend"></div>
      </div>
      <div class="chart-body">
        <div class="chart-wrap" style="height:280px">
          <canvas id="mainChart" role="img" aria-label="Price history chart for ${co.name}"></canvas>
        </div>
      </div>
      <div class="info-strip">
        <div class="info-item"><span class="info-key">Open</span><span class="info-val">$${(prices[0]).toFixed(2)}</span></div>
        <div class="info-item"><span class="info-key">Current</span><span class="info-val">$${cur.toFixed(2)}</span></div>
        <div class="info-item"><span class="info-key">High</span><span class="info-val">$${high.toFixed(2)}</span></div>
        <div class="info-item"><span class="info-key">Low</span><span class="info-val">$${low.toFixed(2)}</span></div>
        <div class="info-item"><span class="info-key">Return</span><span class="info-val" style="color:${totalReturn>=0?'var(--green)':'var(--red)'}">${totalReturn>=0?'+':''}${totalReturn.toFixed(2)}%</span></div>
      </div>
    </div>

    <div class="two-col">
      <div class="chart-card">
        <div class="chart-toolbar">
          <div class="chart-title">Volume — ${co.ticker}</div>
        </div>
        <div class="chart-body">
          <div class="chart-wrap" style="height:160px">
            <canvas id="volChart" role="img" aria-label="Trading volume chart for ${co.name}"></canvas>
          </div>
        </div>
      </div>
      ${compareMode && compareData.length ? `
      <div class="chart-card">
        <div class="chart-toolbar">
          <div class="chart-title">Volume comparison</div>
        </div>
        <div class="chart-body">
          <div class="chart-wrap" style="height:160px">
            <canvas id="vol2Chart" role="img" aria-label="Volume comparison chart"></canvas>
          </div>
        </div>
      </div>` : `
      <div class="chart-card">
        <div class="chart-toolbar">
          <div class="chart-title">Daily returns</div>
        </div>
        <div class="chart-body">
          <div class="chart-wrap" style="height:160px">
            <canvas id="vol2Chart" role="img" aria-label="Daily returns chart for ${co.name}"></canvas>
          </div>
        </div>
      </div>`}
    </div>

    <div id="extraPanels"></div>
  `;

  /* Indicator dropdown */
  const menu = document.getElementById('indMenu');
  document.getElementById('indTrigger').addEventListener('click', e => { e.stopPropagation(); indMenuOpen = !indMenuOpen; menu.classList.toggle('open', indMenuOpen); });
  menu.querySelectorAll('.ind-opt').forEach(o => {
    const go = () => { flipInd(o.dataset.ind); renderAnalysis(); };
    o.addEventListener('click', e => { if (e.target.closest('.info-ic') || o.classList.contains('disabled')) return; go(); });
    o.addEventListener('keydown', e => { if (e.target.closest('.info-ic') || o.classList.contains('disabled')) return; if (e.key==='Enter' || e.key===' ') { e.preventDefault(); go(); } });
  });

  /* Build legend */
  const legend = document.getElementById('priceLegend');
  const allSeries = [{ticker:co.ticker, color:SERIES_COLORS[0]}, ...compareData];
  legend.innerHTML = allSeries.map(s=>`
    <span class="legend-item">
      <span class="legend-dot" style="background:${s.color}"></span>${s.ticker}
    </span>`).join('');
  if(showMA20 && !S.intraday) legend.innerHTML += `<span class="legend-item"><span class="legend-dot" style="background:var(--green)"></span>MA-20</span>`;
  if(showMA200 && !S.intraday) legend.innerHTML += `<span class="legend-item"><span class="legend-dot" style="background:var(--amber)"></span>MA-200</span>`;

  const lg = (c,t) => `<span class="legend-item"><span class="legend-dot" style="background:${c}"></span>${t}</span>`;
  if (showBB) legend.innerHTML += lg('rgba(156,163,175,0.7)','Bollinger');
  if (IND.ema) legend.innerHTML += lg('#60a5fa','EMA 12') + lg('#c084fc','EMA 26');
  if (IND.ichi) legend.innerHTML += lg('#38bdf8','Tenkan') + lg('#f472b6','Kijun') + lg('rgba(52,211,153,0.6)','Cloud');
  if (IND.fib) legend.innerHTML += lg('#cbd5e1','Fib levels');

  /* ── Main price chart ── */
  const skipN = Math.max(1, Math.floor(nDays/60));
  const sparseLabels = labels.map((l,i)=>i%skipN===0?l:'');
  const datasets = [
    {
      label: co.ticker, data: prices, borderColor: SERIES_COLORS[0],
      backgroundColor: SERIES_COLORS[0]+'18', fill: compareData.length===0,
      borderWidth:2, pointRadius:0, tension:0.2, order:2
    },
    ...compareData.map((cd,i)=>({
      label:cd.ticker, data:cd.prices, borderColor:cd.color,
      backgroundColor:'transparent', fill:false,
      borderWidth:1.5, pointRadius:0, tension:0.2, order:3+i
    }))
  ];
  if(showMA20 && !S.intraday) datasets.push({
    label:'MA-20', data:rollingMean(prices,20), borderColor:'#10b981',
    backgroundColor:'transparent', fill:false, borderWidth:1.5, pointRadius:0,
    borderDash:[4,2], tension:0.2, order:1
  });
  if(showMA200 && nDays>=200) datasets.push({
    label:'MA-200', data:ma200, borderColor:'#fb923c',
    backgroundColor:'transparent', fill:false, borderWidth:1.5, pointRadius:0,
    borderDash:[6,3], tension:0.2, order:0
  });
  if(showBB) {
    const bU = S.bbU || rollingMean(prices,20).map((m,i)=> m==null?null: m + 2*Math.sqrt(prices.slice(Math.max(0,i-19),i+1).reduce((a,b)=>a+(b-m)**2,0)/20));
    const bL = S.bbL || rollingMean(prices,20).map((m,i)=> m==null?null: m - 2*Math.sqrt(prices.slice(Math.max(0,i-19),i+1).reduce((a,b)=>a+(b-m)**2,0)/20));
    datasets.push({ label:'BB upper', data:bU, borderColor:'rgba(156,163,175,0.55)', backgroundColor:'transparent', fill:false, borderWidth:1, pointRadius:0, borderDash:[2,2], tension:0.2, order:4 });
    datasets.push({ label:'BB lower', data:bL, borderColor:'rgba(156,163,175,0.55)', backgroundColor:'transparent', fill:false, borderWidth:1, pointRadius:0, borderDash:[2,2], tension:0.2, order:4 });
  }

  const L = (label,data,color,extra={}) => ({ label, data, borderColor:color, backgroundColor:'transparent', fill:false, borderWidth:1.4, pointRadius:0, tension:0.2, order:1, ...extra });
  if (IND.ema) { datasets.push(L('EMA 12', tail(emaArr(F0.c,12)), '#60a5fa')); datasets.push(L('EMA 26', tail(emaArr(F0.c,26)), '#c084fc')); }
  if (IND.ichi) {
    const ik = ichiCalc(FH, FL);
    datasets.push(L('Tenkan', tail(ik.tenkan), '#38bdf8', {borderWidth:1.2}));
    datasets.push(L('Kijun', tail(ik.kijun), '#f472b6', {borderWidth:1.2}));
    datasets.push(L('Span A', tail(ik.spanA), 'rgba(52,211,153,0.40)', {borderWidth:1, fill:'+1', backgroundColor:'rgba(52,211,153,0.10)'}));
    datasets.push(L('Span B', tail(ik.spanB), 'rgba(52,211,153,0.40)', {borderWidth:1}));
  }
  const fibPlugin = { id:'fib', afterDatasetsDraw(chart) {
    if (!IND.fib) return;
    const { ctx, chartArea:ca, scales:{ y } } = chart;
    const fh = Math.max(...prices), fl = Math.min(...prices);
    ctx.save(); ctx.font = '10px JetBrains Mono, monospace';
    [0,0.236,0.382,0.5,0.618,0.786,1].forEach(r => {
      const v = fh - r*(fh-fl), py = y.getPixelForValue(v);
      if (py < ca.top || py > ca.bottom) return;
      ctx.setLineDash([2,4]); ctx.strokeStyle = 'rgba(203,213,225,0.45)';
      ctx.beginPath(); ctx.moveTo(ca.left,py); ctx.lineTo(ca.right,py); ctx.stroke();
      ctx.fillStyle = '#cbd5e1'; ctx.fillText((r*100).toFixed(1)+'%  $'+v.toFixed(2), ca.left+6, py-3);
    });
    ctx.restore(); } };

  const crossPlugin = {
    id:'crossMarkers',
    afterDraw(chart) {
      if(!showMA20 || !showMA200) return;
      const { ctx, chartArea, scales } = chart;
      [[golden,'#f59e0b'],[death,'#ef4444']].forEach(([arr,color])=>{
        arr.forEach(idx=>{
          const x = scales.x.getPixelForValue(idx);
          if (x<chartArea.left || x>chartArea.right) return;
          ctx.save();
          ctx.strokeStyle = color; ctx.lineWidth=1; ctx.setLineDash([3,3]);
          ctx.beginPath(); ctx.moveTo(x,chartArea.top); ctx.lineTo(x,chartArea.bottom); ctx.stroke();
          ctx.restore();
        });
      });
    }
  };

  mainChart = new Chart(document.getElementById('mainChart'), {
    type:'line',
    data:{ labels, datasets },
    plugins:[crossPlugin, fibPlugin],
    options:{
      responsive:true, maintainAspectRatio:false, animation:false,
      interaction:{ intersect:false, mode:'index' },
      plugins:{
        legend:{ display:false },
        tooltip:{
          backgroundColor:'#151515', borderColor:'rgba(255,255,255,0.16)',
          borderWidth:1, titleColor:'#9ca3af', bodyColor:'#f3f4f6',
          padding:10, cornerRadius:8,
          callbacks:{
            label: ctx=>`  ${ctx.dataset.label}: $${ctx.parsed.y.toFixed(2)}`
          }
        }
      },
      scales:{
        x:{ ticks:{ color:'#6b7280', maxRotation:0, font:{size:10},
              callback:(v,i)=>sparseLabels[i]||null },
            grid:{ color:'rgba(255,255,255,0.05)', drawBorder:false },
            border:{ display:false } },
        y:{ ticks:{ color:'#6b7280', font:{size:10}, callback:v=>'$'+v.toFixed(0) },
            grid:{ color:'rgba(255,255,255,0.05)', drawBorder:false },
            border:{ display:false }, position:'right' }
      }
    }
  });

  /* ── Volume chart ── */
  const volColors = vols.map((_,i) => prices[i]>=(prices[i-1]||prices[i]) ? '#10b98150':'#ef444450');
  volChart = new Chart(document.getElementById('volChart'),{
    type:'bar',
    data:{ labels, datasets:[{ label:'Volume', data:vols.map(v=>+(v/1e6).toFixed(1)),
      backgroundColor:volColors, borderWidth:0 }] },
    options:{
      responsive:true, maintainAspectRatio:false, animation:false,
      plugins:{ legend:{display:false}, tooltip:{
        backgroundColor:'#151515', borderColor:'rgba(255,255,255,0.16)',
        borderWidth:1, titleColor:'#9ca3af', bodyColor:'#f3f4f6', padding:8, cornerRadius:6,
        callbacks:{ label:ctx=>`  ${ctx.parsed.y.toFixed(1)}M shares` }
      }},
      scales:{
        x:{ ticks:{display:false}, grid:{display:false}, border:{display:false} },
        y:{ ticks:{ color:'#6b7280', font:{size:10}, callback:v=>v+'M' },
            grid:{ color:'rgba(255,255,255,0.05)', drawBorder:false },
            border:{ display:false }, position:'right' }
      }
    }
  });

  /* ── Second bottom chart ── */
  const cvs2 = document.getElementById('vol2Chart');
  if(compareMode && compareData.length) {
    // Volume comparison bars
    const skip2 = Math.max(1, Math.floor(nDays/30));
    const sparseIdx = Array.from({length:nDays},(_,i)=>i).filter(i=>i%skip2===0);
    const volDs = [{
      label:co.ticker, data:sparseIdx.map(i=>+(vols[i]/1e6).toFixed(1)),
      backgroundColor:SERIES_COLORS[0]+'80', borderWidth:0
    }, ...compareData.map((cd,i)=>{
      const {vols:v2} = genPrices(COMPANIES.find(c=>c.ticker===cd.ticker), nDays);
      return { label:cd.ticker, data:sparseIdx.map(i=>+(v2[i]/1e6).toFixed(1)),
        backgroundColor:cd.color+'80', borderWidth:0 };
    })];
    vol2Chart = new Chart(cvs2,{
      type:'bar',
      data:{ labels:sparseIdx.map(i=>labels[i]), datasets:volDs },
      options:{
        responsive:true, maintainAspectRatio:false, animation:false,
        plugins:{ legend:{ display:true, position:'bottom', labels:{color:'#9ca3af',font:{size:10},boxWidth:10,boxHeight:3} },
          tooltip:{ backgroundColor:'#151515', borderColor:'rgba(255,255,255,0.16)',
            borderWidth:1, titleColor:'#9ca3af', bodyColor:'#f3f4f6', padding:8, cornerRadius:6,
            callbacks:{ label:ctx=>`  ${ctx.dataset.label}: ${ctx.parsed.y.toFixed(1)}M` } }
        },
        scales:{
          x:{ ticks:{display:false}, grid:{display:false}, border:{display:false} },
          y:{ ticks:{ color:'#6b7280', font:{size:10}, callback:v=>v+'M' },
              grid:{ color:'rgba(255,255,255,0.05)', drawBorder:false },
              border:{display:false}, position:'right' }
        }
      }
    });
  } else {
    // Daily returns histogram
    const returns = prices.map((p,i)=>i===0?0:+((p-prices[i-1])/prices[i-1]*100).toFixed(2));
    const retColors = returns.map(r=>r>=0?'#10b98170':'#ef444470');
    vol2Chart = new Chart(cvs2,{
      type:'bar',
      data:{ labels, datasets:[{ label:'Return %', data:returns, backgroundColor:retColors, borderWidth:0 }] },
      options:{
        responsive:true, maintainAspectRatio:false, animation:false,
        plugins:{ legend:{display:false}, tooltip:{
          backgroundColor:'#151515', borderColor:'rgba(255,255,255,0.16)',
          borderWidth:1, titleColor:'#9ca3af', bodyColor:'#f3f4f6', padding:8, cornerRadius:6,
          callbacks:{ label:ctx=>`  ${ctx.parsed.y>=0?'+':''}${ctx.parsed.y.toFixed(2)}%` }
        }},
        scales:{
          x:{ ticks:{display:false}, grid:{display:false}, border:{display:false} },
          y:{ ticks:{ color:'#6b7280', font:{size:10}, callback:v=>(v>=0?'+':'')+v+'%' },
              grid:{ color:'rgba(255,255,255,0.05)', drawBorder:false },
              border:{display:false}, position:'right' }
        }
      }
    });
  }

  /* ── Indicator sub-panels ── */
  const md = macdCalc(prices);
  const ax = (extra={}) => ({ position:'right', ticks:{color:'#6b7280',font:{size:9}}, grid:{color:'rgba(255,255,255,0.05)'}, border:{display:false}, ...extra });
  const ln = (label,data,color,extra={}) => ({ label, data, borderColor:color, backgroundColor:'transparent', borderWidth:1.4, pointRadius:0, tension:0.2, ...extra });
  const refPlugin = (lines, sid) => ({ id:'ref', afterDraw(ch) {
    const { ctx, chartArea:ca, scales } = ch, y = scales[sid];
    ctx.save(); ctx.setLineDash([3,3]); ctx.strokeStyle = 'rgba(156,163,175,0.35)';
    lines.forEach(v => { const py = y.getPixelForValue(v); ctx.beginPath(); ctx.moveTo(ca.left,py); ctx.lineTo(ca.right,py); ctx.stroke(); });
    ctx.restore(); } });
  let html = ''; const jobs = [];
  const addPanel = (id, title, tip, datasets, scales, ref) => {
    html += `<div class="chart-card"><div class="chart-toolbar"><div class="chart-title">${title} ${ic(tip)}</div></div><div class="chart-body"><div class="chart-wrap" style="height:150px"><canvas id="${id}" role="img" aria-label="${title} chart"></canvas></div></div></div>`;
    jobs.push([id, datasets, scales, ref]);
  };
  if (IND.rsi || IND.macd) {
    const ds = [], sc = {};
    if (IND.rsi) { ds.push(ln('RSI', rsiArr, '#a78bfa', {yAxisID:'rsi'})); sc.rsi = ax({position:'left', min:0, max:100}); }
    if (IND.macd) { ds.push(ln('MACD', md.line, '#60a5fa', {yAxisID:'macd'})); ds.push(ln('Signal', md.sig, '#fb923c', {yAxisID:'macd', borderDash:[3,2]}));
      sc.macd = ax(IND.rsi ? {grid:{display:false}} : {}); }
    addPanel('pnlRsi', [IND.rsi&&'RSI (14)', IND.macd&&'MACD'].filter(Boolean).join(' &amp; '), IND.macd?'macd':'rsi', ds, sc, IND.rsi ? [[70,30],'rsi'] : null);
  }
  if (IND.stoch) { const st = stochCalc(FH, FL, F0.c);
    addPanel('pnlStoch', 'Stochastic (14, 3)', 'stoch', [ln('%K', tail(st.k), '#38bdf8'), ln('%D', tail(st.d), '#fb923c', {borderDash:[3,2]})], { y: ax({min:0, max:100}) }, [[80,20],'y']); }
  if (IND.adx) { const ad = adxCalc(FH, FL, F0.c);
    addPanel('pnlAdx', 'ADX (14)', 'adx', [ln('ADX', tail(ad.adx), '#f3f4f6', {borderWidth:2}), ln('+DI', tail(ad.pdi), '#34d399'), ln('−DI', tail(ad.mdi), '#f87171')], { y: ax({min:0}) }, [[25],'y']); }
  if (IND.stdev) addPanel('pnlStd', 'Standard deviation (20)', 'stdev', [ln('Std dev', tail(stdevArr(F0.c,20)), '#a78bfa', {fill:true, backgroundColor:'rgba(167,139,250,0.12)'})], { y: ax() }, null);
  document.getElementById('extraPanels').innerHTML = html;
  jobs.forEach(([id, datasets, scales, ref]) => extraCharts.push(new Chart(document.getElementById(id), {
    type:'line', data:{ labels, datasets }, plugins: ref ? [refPlugin(ref[0], ref[1])] : [],
    options:{ responsive:true, maintainAspectRatio:false, animation:false, interaction:{intersect:false, mode:'index'},
      plugins:{ legend:{display:true, position:'top', align:'end', labels:{color:'#9ca3af', font:{size:10}, boxWidth:10, boxHeight:3}},
        tooltip:{ backgroundColor:'#151515', borderColor:'rgba(255,255,255,0.16)', borderWidth:1, titleColor:'#9ca3af', bodyColor:'#f3f4f6', padding:8, cornerRadius:6 } },
      scales:{ x:{ticks:{display:false}, grid:{display:false}, border:{display:false}}, ...scales } } })));
}

/* ── Screener view (ranks your current watchlist — "all stocks" live-ranking
   isn't practical client-side, so add candidates to the watchlist via search
   first, then screen them) ── */
async function renderScreener() {
  destroyCharts();
  const renderToken = ++renderGen;
  const el = document.getElementById('appContent');
  el.innerHTML = '<div class="loading-state"><div class="spinner"></div><span>Scoring watchlist…</span></div>';
  if (!COMPANIES.length) {
    el.innerHTML = '<div class="no-results" style="padding:40px 0">Your watchlist is empty. Search and add stocks first, then come back to screen them.</div>';
    return;
  }
  const rows = (await Promise.all(COMPANIES.map(computeScreenerRow))).sort((a,b)=>b.score-a.score);
  if (renderToken !== renderGen) return;
  el.innerHTML = `
    <h2 class="sr-only" style="position:absolute;left:-9999px">Stock screener ranking companies by technical score</h2>
    <div class="content-header">
      <div class="co-headline">
        <h1>Stock screener</h1>
        <div class="tagline">Ranked by trend, momentum and RSI ${ic('score')}</div>
      </div>
    </div>
    <div class="chart-card">
      <div class="chart-body" style="overflow-x:auto;padding:0">
        <table class="screener-table">
          <thead><tr>
            <th>Company</th><th>Price</th><th>RSI (14)</th><th>1M momentum</th>
            <th>MA state</th><th>Signal</th>
          </tr></thead>
          <tbody>
          ${rows.map(r => {
            const badge = r.score>=4 ? 'strong' : r.score>=2 ? 'watch' : 'weak';
            const label = r.score>=4 ? 'Promising' : r.score>=2 ? 'Watch' : 'Weak';
            return `<tr data-ticker="${r.co.ticker}">
              <td><span class="ticker-badge">${r.co.ticker}</span> ${r.co.name}</td>
              <td style="font-family:'JetBrains Mono',monospace">$${r.curPrice.toFixed(2)}</td>
              <td style="color:${r.curRSI>=70?'var(--red)':r.curRSI<=30?'var(--green)':'var(--text)'}">${r.curRSI.toFixed(0)}</td>
              <td style="color:${r.mom>=0?'var(--green)':'var(--red)'}">${r.mom>=0?'+':''}${r.mom.toFixed(1)}%</td>
              <td>${r.inGoldenState ? `<span class="cross-badge golden">▲ Golden${r.daysSinceCross<15?' · new':''}</span>` : `<span class="cross-badge death">▼ Death</span>`}</td>
              <td><span class="score-pill ${badge}">${label}</span></td>
            </tr>`;
          }).join('')}
          </tbody>
        </table>
      </div>
    </div>
    <p style="font-size:11px;color:var(--text-3);margin-top:12px">
      Screener logic combines MA-20/MA-200 trend state, 1-month price momentum, and RSI positioning into a simple composite score.
      This is an educational heuristic, not investment advice.
    </p>
  `;
  el.querySelectorAll('tr[data-ticker]').forEach(tr => {
    tr.addEventListener('click', () => {
      setActive(tr.dataset.ticker);
      setView('analysis');
    });
  });
}

async function renderContent() {
  if (activeView==='screener') await renderScreener();
  else await renderAnalysis();
}

function setView(view) {
  activeView = view;
  document.querySelectorAll('.view-tab').forEach(t=>t.classList.toggle('active', t.dataset.view===view));
  renderContent();
}

/* ── Init ── */
document.querySelectorAll('.view-tab').forEach(t => t.addEventListener('click', ()=>setView(t.dataset.view)));

document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  renderSidebar();
});

document.getElementById('tfStrip').addEventListener('click', e => {
  if(e.target.dataset.tf) setTF(e.target.dataset.tf);
});

document.getElementById('compareToggle').addEventListener('click', () => {
  compareMode = !compareMode;
  document.getElementById('toggleTrack').classList.toggle('on', compareMode);
  document.getElementById('compareList').classList.toggle('show', compareMode);
  if(!compareMode) compareTickers = [];
  renderContent();
});

document.addEventListener('click', e => {
  if (indMenuOpen && !e.target.closest('#indMenu')) { indMenuOpen = false; const m = document.getElementById('indMenu'); if (m) m.classList.remove('open'); }
});
initTooltips();
checkApiHealth();
renderSidebar();
renderContent();
</script>
</body>
</html>
